name: Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -count=1 -cover ./...
      - name: Build
        run: go build -o /tmp/symbol-web ./cmd/server
      - name: Check JavaScript syntax
        run: for script in static/js/*.js; do node --check "$script"; done
      - name: Frontend async regressions
        run: node --test tests/frontend.test.js
